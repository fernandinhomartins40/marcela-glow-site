server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # O manifesto do build redireciona para o da API, que monta a lista de
    # icones com o que a clinica enviou pelo painel. Assim qualquer leitura do
    # manifesto — inclusive a de uma reinstalacao — enxerga a marca atual.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
        return 302 /api/landing/manifest/admin.webmanifest;
    }

    # Os icones tambem sao editaveis, e a regra imutavel abaixo casa com
    # `icon-192.png`: sem esta excecao o navegador guardaria o icone antigo por
    # um ano e nem perguntaria se mudou.
    location ~* ^/icon[-.] {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O HTML e revalidado a cada visita.
    #
    # Os assets acima sao imutaveis porque o hash esta no nome, mas o
    # index.html e quem aponta para eles. Sem instrucao de cache o navegador
    # guarda o HTML por conta propria e segue pedindo o CSS antigo — que ainda
    # existe no cache dele. O deploy conclui e a tela continua velha.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
