server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - all routes to index.html
    # O HTML e revalidado a cada visita.
    #
    # Os assets acima sao imutaveis porque o hash esta no nome, mas o
    # index.html e quem aponta para eles. Sem instrucao de cache o navegador
    # guarda o HTML por conta propria e segue pedindo o CSS antigo — que ainda
    # existe no cache dele. O deploy conclui e a tela continua velha.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
