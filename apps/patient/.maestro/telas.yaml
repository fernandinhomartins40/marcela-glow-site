# Auditoria de telas do "Minha Jornada" no simulador de iPhone do GitHub Actions
# (.github/workflows/app-ios-video.yml, roteiro "telas"). Abre cada tela da
# paciente e toca nos campos para provar que o app não amplia ao focar. Um
# print por passo.
#
# Só olha: não envia pedido nem mensagem e NÃO confirma a exclusão de conta
# (abre a tela e fecha). Passo que depende de dado existir é opcional.
appId: br.com.dramarceladuch.paciente
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Quero criar meu acesso"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: 01-login
- tapOn: "E-mail"
- waitForAnimationToEnd
- takeScreenshot: 02-login-campo-focado

- tapOn: "Quero criar meu acesso"
- waitForAnimationToEnd
- takeScreenshot: 03-criar-acesso
- tapOn:
    text: ".*[Nn]ome.*"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 04-criar-acesso-campo-focado

# Volta ao login abrindo o app de novo (sem apagar nada).
- launchApp
- extendedWaitUntil:
    visible: "Quero criar meu acesso"
    timeout: 60000
- tapOn: "E-mail"
- inputText: ${EMAIL}
- tapOn: "Senha"
- inputText: ${SENHA}
- pressKey: Enter
- extendedWaitUntil:
    visible: "Jornada"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 05-inicio
- scroll
- takeScreenshot: 06-inicio-rolado

- tapOn: "Consultas"
- waitForAnimationToEnd
- takeScreenshot: 07-consultas
- tapOn:
    text: "Solicitar horário"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 08-solicitar-horario
- scroll
- takeScreenshot: 09-solicitar-horario-rolado

- tapOn: "Jornada"
- waitForAnimationToEnd
- takeScreenshot: 10-jornada
- tapOn:
    text: ".*Ver detalhes.*"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 11-jornada-detalhe
- scroll
- takeScreenshot: 12-jornada-detalhe-rolado
- tapOn:
    text: "Minha jornada"
    optional: true
- waitForAnimationToEnd

- tapOn: "Documentos"
- waitForAnimationToEnd
- takeScreenshot: 13-documentos
- tapOn:
    text: ".*Orientações.*"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 14-documento-aberto
- tapOn: "Documentos"
- waitForAnimationToEnd

- tapOn: "Mais"
- waitForAnimationToEnd
- takeScreenshot: 15-mais
- tapOn: "Mensagens"
- waitForAnimationToEnd
- takeScreenshot: 16-mensagens
- tapOn:
    text: ".*(Escreva|mensagem|Mensagem).*"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 17-mensagens-campo-focado

- tapOn: "Mais"
- tapOn: "Excluir minha conta"
- extendedWaitUntil:
    visible: "Confirme com a sua senha"
    timeout: 10000
- takeScreenshot: 18-excluir-conta
- tapOn: "Confirme com a sua senha"
- waitForAnimationToEnd
- takeScreenshot: 19-excluir-conta-campo-focado
# Fecha sem confirmar.
- tapOn:
    text: "Fechar"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 20-depois-de-fechar
