name: Apps nativos

# Compila os apps de loja (Capacitor) do portal da paciente ("Minha Jornada")
# e do painel da médica ("Marcela CRM"). É O caminho de build dos apps: nada
# precisa ser compilado no computador.
#
# Disparo:
#   - manual (Actions > Apps nativos > Run workflow): escolhe app, sistema,
#     versão e se envia às lojas;
#   - por tag: `paciente-v1.2.3` ou `medica-v1.2.3` compila os dois sistemas
#     daquele app com a versão 1.2.3 (só gera; não envia).
#
# Cada execução deixa os arquivos para baixar em "Artifacts" (30 dias):
#   <app>-android-aab-<versao>-<build>              AAB para o Play (assinado se houver chave)
#   <app>-android-apk-<versao>-<build>              APK para instalar no celular e testar
#   <app>-android-apk-teste-local-<versao>-<build>  APK de teste que fala com a API em 10.0.2.2 (emulador)
#   <app>-ios-ipa-<versao>-<build>                  IPA assinado (com a chave da Apple)
#   <app>-ios-xcarchive-sem-assinatura-<versao>-<build>  sem a chave: só prova que compila
#
# Sem os segredos, compila sem assinar e o resumo da execução diz o que falta.
# Nunca finge envio. Segredos e passo a passo: docs/nativo/PUBLICACAO.md.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Qual app
        type: choice
        options: [paciente, medica]
        required: true
      plataforma:
        description: Qual sistema
        type: choice
        options: [ambas, android, ios]
        default: ambas
      versao:
        description: Versão que a loja mostra (ex. 1.0.0)
        default: 1.0.0
        required: true
      enviar:
        description: Enviar às lojas (teste interno do Play / TestFlight), se os segredos existirem
        type: boolean
        default: false
  push:
    tags:
      - 'paciente-v*'
      - 'medica-v*'

concurrency:
  group: apps-nativos-${{ github.ref }}-${{ inputs.app || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decide app, versão e plataformas uma vez; os dois jobs seguintes leem daqui.
  preparar:
    name: Preparar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.p.outputs.app }}
      pasta: ${{ steps.p.outputs.pasta }}
      workspace: ${{ steps.p.outputs.workspace }}
      id: ${{ steps.p.outputs.id }}
      versao: ${{ steps.p.outputs.versao }}
      build: ${{ steps.p.outputs.build }}
      android: ${{ steps.p.outputs.android }}
      ios: ${{ steps.p.outputs.ios }}
      enviar: ${{ steps.p.outputs.enviar }}
    steps:
      - id: p
        env:
          EVENTO: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_APP: ${{ inputs.app }}
          IN_PLATAFORMA: ${{ inputs.plataforma }}
          IN_VERSAO: ${{ inputs.versao }}
          IN_ENVIAR: ${{ inputs.enviar }}
          NUMERO: ${{ github.run_number }}
        run: |
          if [ "$EVENTO" = "push" ]; then
            app="${REF_NAME%%-v*}"
            versao="${REF_NAME#*-v}"
            plataforma=ambas
            enviar=false
          else
            app="$IN_APP"
            versao="$IN_VERSAO"
            plataforma="$IN_PLATAFORMA"
            enviar="$IN_ENVIAR"
          fi

          # Só dígitos e pontos: é o formato que a tela "atualize o app" compara.
          if ! printf '%s' "$versao" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::Versão '$versao' inválida. Use números e pontos, ex.: 1.2.3 (tag paciente-v1.2.3)."
            exit 1
          fi

          case "$app" in
            paciente) pasta=apps/patient; workspace=@marcela/patient; id=br.com.dramarceladuch.paciente ;;
            medica)   pasta=apps/admin;   workspace=@marcela/admin;   id=br.com.dramarceladuch.medica ;;
            *) echo "::error::App '$app' desconhecido (esperado paciente ou medica)."; exit 1 ;;
          esac

          android=false; ios=false
          case "$plataforma" in
            ambas) android=true; ios=true ;;
            android) android=true ;;
            ios) ios=true ;;
          esac

          {
            echo "app=$app"; echo "pasta=$pasta"; echo "workspace=$workspace"; echo "id=$id"
            echo "versao=$versao"; echo "build=$NUMERO"; echo "enviar=$enviar"
            echo "android=$android"; echo "ios=$ios"
          } >> "$GITHUB_OUTPUT"
          echo "### $app $versao (build $NUMERO) — android: $android, ios: $ios, enviar às lojas: $enviar" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android (${{ needs.preparar.outputs.app }})
    needs: preparar
    if: needs.preparar.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP: ${{ needs.preparar.outputs.app }}
      PASTA: ${{ needs.preparar.outputs.pasta }}
      WS: ${{ needs.preparar.outputs.workspace }}
      APP_ID: ${{ needs.preparar.outputs.id }}
      VERSAO: ${{ needs.preparar.outputs.versao }}
      BUILD: ${{ needs.preparar.outputs.build }}
      ENVIAR: ${{ needs.preparar.outputs.enviar }}
      SAIDA: ${{ github.workspace }}/saida
      # Só "true"/"false" — o valor do segredo não sai daqui.
      TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      TEM_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      TEM_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Node 22: o @capacitor/cli 8 exige >= 22. npm 10 vem com ele.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # O monorepo inteiro: o @capacitor/cli é devDependency de cada app.
      # O prisma não é usado pelos fronts; o generate do postinstall é inofensivo.
      - name: Instalar dependências
        run: npm ci

      - name: Build web do app (produção)
        run: npm run build:nativo -w "$WS"

      - name: Firebase (google-services.json)
        if: env.APP == 'paciente'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ "$TEM_FIREBASE" = "true" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$PASTA/android/app/google-services.json"
          else
            echo "::warning::Sem GOOGLE_SERVICES_JSON_BASE64: o app abre, mas não recebe notificações."
          fi

      - name: Sincronizar a casca
        working-directory: ${{ env.PASTA }}
        run: npx cap sync android

      - name: Chave de upload
        if: env.TEM_CHAVE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Com a chave: AAB e APK de release assinados (o APK instala no celular).
      # Sem a chave: AAB sem assinatura (o Play recusa) e APK de depuração para teste.
      - name: Compilar AAB e APK
        working-directory: ${{ env.PASTA }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERS=(-PversaoApp="$VERSAO" -PbuildApp="$BUILD")
          mkdir -p "$SAIDA/aab" "$SAIDA/apk"
          if [ "$TEM_CHAVE" = "true" ]; then
            ./gradlew bundleRelease assembleRelease "${VERS[@]}"
            cp app/build/outputs/bundle/release/app-release.aab "$SAIDA/aab/$APP-$VERSAO-$BUILD.aab"
            cp app/build/outputs/apk/release/app-release.apk "$SAIDA/apk/$APP-$VERSAO-$BUILD.apk"
          else
            ./gradlew bundleRelease assembleDebug "${VERS[@]}"
            cp app/build/outputs/bundle/release/app-release.aab "$SAIDA/aab/$APP-$VERSAO-$BUILD-SEM-ASSINATURA.aab"
            cp app/build/outputs/apk/debug/app-debug.apk "$SAIDA/apk/$APP-$VERSAO-$BUILD-depuracao.apk"
          fi

      - name: Guardar o AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-android-aab-${{ env.VERSAO }}-${{ env.BUILD }}
          path: ${{ env.SAIDA }}/aab/
          if-no-files-found: error
          retention-days: 30

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-android-apk-${{ env.VERSAO }}-${{ env.BUILD }}
          path: ${{ env.SAIDA }}/apk/
          if-no-files-found: error
          retention-days: 30

      - name: Enviar ao Google Play (teste interno)
        if: env.ENVIAR == 'true' && env.TEM_CHAVE == 'true' && env.TEM_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.APP_ID }}
          releaseFiles: ${{ env.PASTA }}/android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

      # Por último, porque troca o conteúdo da casca: APK de depuração que fala com
      # a API local do emulador (http://10.0.2.2:3001/api). Só para verificação.
      - name: APK de teste local (10.0.2.2)
        run: |
          npm run build:nativo:teste -w "$WS"
          cd "$PASTA/android"
          ./gradlew assembleDebug -PversaoApp="$VERSAO" -PbuildApp="$BUILD"
          mkdir -p "$SAIDA/teste"
          cp app/build/outputs/apk/debug/app-debug.apk "$SAIDA/teste/$APP-$VERSAO-$BUILD-teste-local-10.0.2.2.apk"

      - name: Guardar o APK de teste local
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-android-apk-teste-local-${{ env.VERSAO }}-${{ env.BUILD }}
          path: ${{ env.SAIDA }}/teste/
          if-no-files-found: error
          retention-days: 30

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Android — $APP $VERSAO (build $BUILD)"
            if [ "$TEM_CHAVE" = "true" ]; then
              echo "- AAB **assinado** com a chave de upload (artefato \`$APP-android-aab-$VERSAO-$BUILD\`): é o que vai para o Play Console."
              echo "- APK de release assinado (artefato \`$APP-android-apk-$VERSAO-$BUILD\`): instala no celular para teste."
            else
              echo "- ⚠️ **Sem chave de upload: o AAB saiu SEM ASSINATURA e o Google Play não o aceita.**"
              echo "  Faltam os segredos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
              echo "- APK de depuração (artefato \`$APP-android-apk-$VERSAO-$BUILD\`): instala no celular para teste, não serve para a loja."
            fi
            echo "- APK de teste local (artefato \`$APP-android-apk-teste-local-$VERSAO-$BUILD\`): só para o emulador com a API em http://10.0.2.2:3001."
            if [ "$ENVIAR" != "true" ]; then
              echo "- Não enviado ao Google Play (envio não pedido nesta execução). Baixe o AAB e envie pelo Play Console."
            elif [ "$TEM_CHAVE" = "true" ] && [ "$TEM_PLAY" = "true" ]; then
              echo "- Enviado à faixa de **teste interno** do Google Play — confira o passo \"Enviar ao Google Play\": se ele falhou, não foi."
            else
              echo "- ⚠️ **Envio pedido, mas NÃO feito**: falta PLAY_SERVICE_ACCOUNT_JSON ou a chave de upload."
            fi
            if [ "$APP" = "paciente" ] && [ "$TEM_FIREBASE" != "true" ]; then
              echo "- ⚠️ **Sem GOOGLE_SERVICES_JSON_BASE64**: o app funciona, mas não recebe notificações."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS (${{ needs.preparar.outputs.app }})
    needs: preparar
    if: needs.preparar.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP: ${{ needs.preparar.outputs.app }}
      PASTA: ${{ needs.preparar.outputs.pasta }}
      WS: ${{ needs.preparar.outputs.workspace }}
      VERSAO: ${{ needs.preparar.outputs.versao }}
      BUILD: ${{ needs.preparar.outputs.build }}
      ENVIAR: ${{ needs.preparar.outputs.enviar }}
      SAIDA: ${{ github.workspace }}/saida
      TEM_APPLE: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
      TEM_FIREBASE: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build web do app
        run: npm run build:nativo -w "$WS"

      # No Windows o `cap add ios` do paciente não criou os links do SwiftPM e o
      # Package.swift ficou sem plugins; aqui, no macOS, o sync o completa.
      - name: Sincronizar a casca
        working-directory: ${{ env.PASTA }}
        run: npx cap sync ios

      - name: Guardar o Package.swift gerado (para versionar)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-ios-package-swift-${{ env.VERSAO }}-${{ env.BUILD }}
          path: ${{ env.PASTA }}/ios/App/CapApp-SPM/Package.swift
          if-no-files-found: error
          retention-days: 30

      - name: Firebase (GoogleService-Info.plist)
        if: env.APP == 'paciente'
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ "$TEM_FIREBASE" != "true" ]; then
            echo "::warning::Sem GOOGLE_SERVICE_INFO_PLIST_BASE64: o app abre, mas não recebe notificações."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -D > "$PASTA/ios/App/App/GoogleService-Info.plist"
          # O arquivo não é versionado (segredo), então só aqui entra no projeto,
          # na fase "Copy Bundle Resources" do alvo App. A gem xcodeproj vem com o CocoaPods da imagem.
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --user-install --no-document
          ruby -e '
            require "xcodeproj"
            projeto = Xcodeproj::Project.open(ARGV[0])
            alvo = projeto.targets.find { |t| t.name == "App" }
            grupo = projeto.main_group.find_subpath("App", false)
            ref = grupo.files.find { |f| f.path == "GoogleService-Info.plist" } || grupo.new_reference("GoogleService-Info.plist")
            alvo.add_resources([ref]) unless alvo.resources_build_phase.files_references.include?(ref)
            projeto.save
          ' "$PASTA/ios/App/App.xcodeproj"

      # Assinatura automática pela chave da API do App Store Connect: o Xcode cria
      # o certificado de distribuição e o perfil sozinho — sem Mac e sem .p12.
      - name: IPA assinado
        if: env.TEM_APPLE == 'true'
        working-directory: ${{ env.PASTA }}/ios/App
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          CHAVE="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 -D > "$CHAVE"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$CHAVE"
                -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
                -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")

          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSAO" CURRENT_PROJECT_VERSION="$BUILD" \
            "${AUTH[@]}" archive

          opcoes() {
            cat > "$RUNNER_TEMP/ExportOptions-$1.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$1</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict>
          </plist>
          EOF
          }

          # destination=export: o IPA fica aqui, para baixar.
          opcoes export
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"
          mkdir -p "$SAIDA/ipa"
          cp "$RUNNER_TEMP"/export/*.ipa "$SAIDA/ipa/$APP-$VERSAO-$BUILD.ipa"

          # destination=upload: o próprio xcodebuild envia ao App Store Connect (TestFlight).
          if [ "$ENVIAR" = "true" ]; then
            opcoes upload
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" -exportPath "$RUNNER_TEMP/upload" \
              "${AUTH[@]}"
          fi
          rm -f "$CHAVE"

      - name: Guardar o IPA
        if: env.TEM_APPLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-ios-ipa-${{ env.VERSAO }}-${{ env.BUILD }}
          path: ${{ env.SAIDA }}/ipa/
          if-no-files-found: error
          retention-days: 30

      - name: Arquivo sem assinatura (sem chave da Apple)
        if: env.TEM_APPLE != 'true'
        working-directory: ${{ env.PASTA }}/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$VERSAO" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          mkdir -p "$SAIDA/xcarchive"
          ditto -c -k --keepParent "$RUNNER_TEMP/App.xcarchive" "$SAIDA/xcarchive/$APP-$VERSAO-$BUILD-SEM-ASSINATURA.xcarchive.zip"

      - name: Guardar o arquivo sem assinatura
        if: env.TEM_APPLE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-ios-xcarchive-sem-assinatura-${{ env.VERSAO }}-${{ env.BUILD }}
          path: ${{ env.SAIDA }}/xcarchive/
          if-no-files-found: error
          retention-days: 30

      - name: Resumo
        if: always()
        run: |
          {
            echo "## iOS — $APP $VERSAO (build $BUILD)"
            if [ "$TEM_APPLE" = "true" ]; then
              echo "- IPA **assinado** para a App Store (artefato \`$APP-ios-ipa-$VERSAO-$BUILD\`)."
              if [ "$ENVIAR" = "true" ]; then
                echo "- Enviado ao App Store Connect — confira o passo \"IPA assinado\": se falhou, não foi. Aparece no TestFlight depois do processamento da Apple."
              else
                echo "- Não enviado (envio não pedido nesta execução). Rode de novo marcando \"Enviar às lojas\", ou envie o IPA pelo Transporter (Mac)."
              fi
            else
              echo "- ⚠️ **Sem chave da Apple: o arquivo saiu SEM ASSINATURA e não pode ir para a App Store nem para o TestFlight.** Só prova que o projeto compila."
              echo "  Faltam os segredos APP_STORE_CONNECT_KEY_BASE64, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APPLE_TEAM_ID."
            fi
            if [ "$APP" = "paciente" ] && [ "$TEM_FIREBASE" != "true" ]; then
              echo "- ⚠️ **Sem GOOGLE_SERVICE_INFO_PLIST_BASE64**: o app funciona, mas não recebe notificações."
            fi
            echo "- O Package.swift gerado no macOS está no artefato \`$APP-ios-package-swift-$VERSAO-$BUILD\`; se diferir do versionado, copie-o para o repositório."
          } >> "$GITHUB_STEP_SUMMARY"
