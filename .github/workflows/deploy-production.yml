name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VPS_HOST: 72.60.10.108
  VPS_USER: root
  APP_ROOT: /opt/dramarcela
  DEPLOY_PORT: "3095"
  PRIMARY_DOMAIN: dramarceladuch.com.br
  SECONDARY_DOMAIN: www.dramarceladuch.com.br
  CANONICAL_URL: https://www.dramarceladuch.com.br
  SSL_EMAIL: admin@dramarceladuch.com.br
  SITE_NAME: dramarcela
  SSH_OPTS: -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=20

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 0: calcular a tag uma vez
  #
  # Os dois jobs seguintes precisam da mesma string: o build a usa para marcar
  # a imagem, o deploy para baixar exatamente aquela. Calculada em cada job,
  # daria valores diferentes — o timestamp muda.
  # ───────────────────────────────────────────────────────────────────────────
  version:
    name: Release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      prefix: ${{ steps.v.outputs.prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version and image prefix
        id: v
        run: |
          echo "tag=$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: compilar as imagens aqui e publicar no GHCR
  #
  # A VPS nao compila mais nada. Antes o deploy mandava o codigo-fonte e rodava
  # `compose build` la, disputando CPU e disco com os ~10 projetos que dividem
  # a maquina — foi o que a derrubou.
  #
  # As quatro imagens sao independentes: a matriz as compila em paralelo, cada
  # uma no seu runner.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.app }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        app: [api, web, admin, patient]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ needs.version.outputs.prefix }}-${{ matrix.app }}:${{ needs.version.outputs.tag }}
            ${{ needs.version.outputs.prefix }}-${{ matrix.app }}:latest
          build-args: |
            VITE_API_URL=/api
            VITE_TENANT_SLUG=marcela-duch
          # Cache no proprio registry: a camada de dependencias so e refeita
          # quando o package-lock muda.
          cache-from: type=registry,ref=${{ needs.version.outputs.prefix }}-${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=${{ needs.version.outputs.prefix }}-${{ matrix.app }}:buildcache,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: a VPS so baixa a imagem e sobe
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: production
      url: https://www.dramarceladuch.com.br

    permissions:
      contents: read
      packages: read

    env:
      RELEASE_VERSION: ${{ needs.version.outputs.tag }}
      IMAGE_PREFIX: ${{ needs.version.outputs.prefix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Verify VPS password access
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -z "${SSHPASS:-}" ]; then
            echo "GitHub secret VPS_PASSWORD is empty or missing." >&2
            exit 1
          fi

          if ! sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "echo SSH password authentication OK"; then
            echo "::error::SSH password authentication failed. Confirm that the GitHub secret VPS_PASSWORD contains the root password for ${{ env.VPS_HOST }} and that PasswordAuthentication/PermitRootLogin are enabled on the VPS." >&2
            exit 1
          fi

      # Só os arquivos de runtime. O codigo-fonte nao vai mais: a VPS nao
      # compila nada, entao nao precisa dele. Antes subia o monorepo inteiro
      # a cada deploy.
      - name: Upload runtime files to VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          RELEASE_DIR="${{ env.APP_ROOT }}/releases/${{ env.RELEASE_VERSION }}"
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "mkdir -p '$RELEASE_DIR'"

          tar -czf - \
            docker-compose.yml \
            docker-compose.prod.yml \
            nginx \
            .github/scripts \
            | sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
              "tar -xzf - -C '$RELEASE_DIR'"

      - name: Prepare VPS runtime
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "bash -s" <<'ENDSSH'
            set -euo pipefail

            if ! command -v apt-get >/dev/null 2>&1; then
              echo "Unsupported VPS distribution: apt-get is required" >&2
              exit 1
            fi

            export DEBIAN_FRONTEND=noninteractive
            APT_UPDATED=0

            apt_update_once() {
              if [ "$APT_UPDATED" -eq 0 ]; then
                apt-get update
                APT_UPDATED=1
              fi
            }

            ensure_apt_packages() {
              local missing=0
              local package_name
              for package_name in "$@"; do
                if ! dpkg-query -W -f='${Status}' "$package_name" 2>/dev/null | grep -q 'install ok installed'; then
                  missing=1
                  break
                fi
              done
              if [ "$missing" -eq 1 ]; then
                apt_update_once
                apt-get install -y --no-install-recommends "$@"
              fi
            }

            ensure_apt_packages ca-certificates certbot curl nginx openssl tar util-linux

            if ! command -v docker >/dev/null 2>&1; then
              apt_update_once
              apt-get install -y --no-install-recommends docker.io
            fi

            if ! docker compose version >/dev/null 2>&1; then
              apt_update_once
              apt-get install -y --no-install-recommends docker-compose-v2 || \
              apt-get install -y --no-install-recommends docker-compose-plugin
            fi

            systemctl enable --now docker
            systemctl enable --now nginx

            docker compose version >/dev/null
            nginx -v >/dev/null 2>&1
            certbot --version >/dev/null
          ENDSSH

      - name: Ensure .env exists on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' CANONICAL_URL='${{ env.CANONICAL_URL }}' DEPLOY_PORT='${{ env.DEPLOY_PORT }}' PRIMARY_DOMAIN='${{ env.PRIMARY_DOMAIN }}' SECONDARY_DOMAIN='${{ env.SECONDARY_DOMAIN }}' IMAGE_PREFIX='${{ env.IMAGE_PREFIX }}' IMAGE_TAG='${{ env.RELEASE_VERSION }}' bash -s" <<'ENDSSH'
            set -euo pipefail

            ENV_FILE="$APP_ROOT/.env"
            mkdir -p "$APP_ROOT"
            touch "$ENV_FILE"
            chmod 600 "$ENV_FILE"

            get_env() {
              local key="$1"
              awk -F= -v key="$key" '$1 == key { sub(/^[^=]*=/, "", $0); print $0; exit }' "$ENV_FILE"
            }

            upsert_env() {
              local key="$1"
              local value="$2"
              local tmp_file
              tmp_file="$(mktemp)"
              awk -v key="$key" -v value="$value" '
                BEGIN { updated = 0 }
                index($0, key "=") == 1 { print key "=" value; updated = 1; next }
                { print }
                END { if (!updated) print key "=" value }
              ' "$ENV_FILE" > "$tmp_file"
              mv "$tmp_file" "$ENV_FILE"
            }

            ensure_env() {
              local key="$1"
              local default_value="$2"
              local current_value
              current_value="$(get_env "$key" | tr -d '\r')"
              if [ -z "$current_value" ]; then
                upsert_env "$key" "$default_value"
              fi
            }

            ensure_random_hex() {
              local key="$1"
              local bytes="$2"
              local current_value
              current_value="$(get_env "$key" | tr -d '\r')"
              if [ -z "$current_value" ]; then
                upsert_env "$key" "$(openssl rand -hex "$bytes")"
              fi
            }

            ensure_vapid_keys() {
              if [ -n "$(get_env "VAPID_PUBLIC_KEY" | tr -d '\r')" ] && [ -n "$(get_env "VAPID_PRIVATE_KEY" | tr -d '\r')" ]; then
                return
              fi

              local keys public_key private_key
              keys="$(docker run --rm node:20-alpine sh -c 'npm --silent install -g web-push >/dev/null 2>&1 && web-push generate-vapid-keys --json')"
              public_key="$(printf '%s' "$keys" | sed -n 's/.*"publicKey":"\([^"]*\)".*/\1/p')"
              private_key="$(printf '%s' "$keys" | sed -n 's/.*"privateKey":"\([^"]*\)".*/\1/p')"

              if [ -n "$public_key" ] && [ -n "$private_key" ]; then
                upsert_env "VAPID_PUBLIC_KEY" "$public_key"
                upsert_env "VAPID_PRIVATE_KEY" "$private_key"
              fi
            }

            ensure_env "POSTGRES_USER" "marcela"
            ensure_env "POSTGRES_DB" "marcela_glow"
            ensure_random_hex "POSTGRES_PASSWORD" 32
            ensure_random_hex "JWT_SECRET" 32
            ensure_random_hex "BOOTSTRAP_TOKEN" 32
            ensure_random_hex "PRESCRIPTION_SIGNING_SECRET" 32
            ensure_random_hex "S3_SECRET_ACCESS_KEY" 32
            ensure_env "S3_ACCESS_KEY_ID" "marcela"
            ensure_env "S3_BUCKET" "marcela-files"
            ensure_env "S3_REGION" "us-east-1"
            ensure_env "S3_FORCE_PATH_STYLE" "true"
            ensure_env "VAPID_SUBJECT" "mailto:admin@dramarceladuch.com.br"
            ensure_vapid_keys

            upsert_env "NODE_ENV" "production"
            upsert_env "PORT" "3001"
            # Qual imagem do GHCR esta release usa. A tag e imutavel: para
            # reverter, aponte IMAGE_TAG para a anterior e suba de novo.
            upsert_env "IMAGE_PREFIX" "$IMAGE_PREFIX"
            upsert_env "IMAGE_TAG" "$IMAGE_TAG"
            # O padrão de 100/15min é baixo para uso real: o painel carrega seis
            # endpoints por tela e a recepção fica o dia todo dentro dele.
            ensure_env "RATE_LIMIT_MAX" "1200"
            # nginx do host + nginx do compose
            ensure_env "TRUST_PROXY_HOPS" "2"
            upsert_env "DEPLOY_PORT" "$DEPLOY_PORT"
            upsert_env "EXTERNAL_PORT" "$DEPLOY_PORT"
            upsert_env "VITE_API_URL" "/api"
            upsert_env "VITE_TENANT_SLUG" "marcela-duch"
            upsert_env "PUBLIC_APP_URL" "$CANONICAL_URL"
            # Os dois domínios respondem: o secundário redireciona, mas um app já
            # aberto nele continua chamando a API com aquela origem.
            upsert_env "CORS_ORIGIN" "https://${SECONDARY_DOMAIN},https://${PRIMARY_DOMAIN}"
            upsert_env "FRONTEND_URL" "$CANONICAL_URL"
            upsert_env "S3_ENDPOINT" "http://minio:9000"
            upsert_env "S3_PUBLIC_BASE_URL" "$CANONICAL_URL/files"

            POSTGRES_USER_VALUE="$(get_env "POSTGRES_USER" | tr -d '\r')"
            POSTGRES_PASSWORD_VALUE="$(get_env "POSTGRES_PASSWORD" | tr -d '\r')"
            POSTGRES_DB_VALUE="$(get_env "POSTGRES_DB" | tr -d '\r')"
            upsert_env "DATABASE_URL" "postgresql://${POSTGRES_USER_VALUE}:${POSTGRES_PASSWORD_VALUE}@postgres:5432/${POSTGRES_DB_VALUE}?schema=public"

            chmod 600 "$ENV_FILE"
          ENDSSH

      # O repositorio e privado, entao o GHCR exige login para baixar a imagem.
      # O GITHUB_TOKEN do run serve e expira sozinho ao fim dele — nao fica
      # credencial de longa duracao na VPS.
      - name: Log in to GHCR on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' RELEASE='${{ env.RELEASE_VERSION }}' DEPLOY_PORT='${{ env.DEPLOY_PORT }}' bash '${{ env.APP_ROOT }}/releases/${{ env.RELEASE_VERSION }}/.github/scripts/remote-deploy.sh'"

      - name: Configure Nginx (HTTP)
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "DEPLOY_PORT='${{ env.DEPLOY_PORT }}' PRIMARY_DOMAIN='${{ env.PRIMARY_DOMAIN }}' SECONDARY_DOMAIN='${{ env.SECONDARY_DOMAIN }}' SITE_NAME='${{ env.SITE_NAME }}' bash -s" <<'ENDSSH'
            set -euo pipefail

            mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled /var/www/certbot
            {
              printf '%s\n' 'server {'
              printf '%s\n' '    listen 80;'
              printf '%s\n' "    server_name ${PRIMARY_DOMAIN} ${SECONDARY_DOMAIN};"
              printf '%s\n' ''
              printf '%s\n' '    client_max_body_size 50m;'
              printf '%s\n' ''
              printf '%s\n' '    location /.well-known/acme-challenge/ {'
              printf '%s\n' '        root /var/www/certbot;'
              printf '%s\n' '    }'
              printf '%s\n' ''
              printf '%s\n' '    location / {'
              printf '%s\n' "        proxy_pass http://127.0.0.1:${DEPLOY_PORT};"
              printf '%s\n' '        proxy_http_version 1.1;'
              printf '%s\n' '        proxy_set_header Upgrade $http_upgrade;'
              printf '%s\n' '        proxy_set_header Connection "upgrade";'
              printf '%s\n' '        proxy_set_header Host $host;'
              printf '%s\n' '        proxy_set_header X-Real-IP $remote_addr;'
              printf '%s\n' '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;'
              printf '%s\n' '        proxy_set_header X-Forwarded-Proto $scheme;'
              printf '%s\n' '        proxy_read_timeout 86400;'
              printf '%s\n' '    }'
              printf '%s\n' '}'
            } > "/etc/nginx/sites-available/${SITE_NAME}"

            # O site default do nginx captura o :80 e responde antes do nosso
            # server_name em requisição sem Host correspondente
            rm -f /etc/nginx/sites-enabled/default

            ln -sf "/etc/nginx/sites-available/${SITE_NAME}" "/etc/nginx/sites-enabled/${SITE_NAME}"
            nginx -t
            systemctl reload nginx
          ENDSSH

      - name: Obtain SSL certificate
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "PRIMARY_DOMAIN='${{ env.PRIMARY_DOMAIN }}' SECONDARY_DOMAIN='${{ env.SECONDARY_DOMAIN }}' SSL_EMAIL='${{ env.SSL_EMAIL }}' bash -s" <<'ENDSSH'
            set -euo pipefail

            mkdir -p /var/www/certbot

            # A VPS hospeda dezenas de domínios e roda certbot.timer/snap timer.
            # Um `pkill -f certbot` aqui abortava a renovação de OUTROS sites no
            # meio do caminho. Em vez de matar, espera o lock liberar.
            wait_for_certbot() {
              local waited=0
              while pgrep -x certbot >/dev/null 2>&1 || pgrep -f '/usr/bin/certbot' >/dev/null 2>&1; do
                if [ "$waited" -ge 180 ]; then
                  echo "Outro certbot segue rodando após 180s; pulando etapa de SSL." >&2
                  return 1
                fi
                echo "Aguardando outra instância do certbot terminar (${waited}s)..."
                sleep 10
                waited=$((waited + 10))
              done
              return 0
            }

            if [ ! -f "/etc/letsencrypt/live/${PRIMARY_DOMAIN}/fullchain.pem" ]; then
              if wait_for_certbot; then
                if ! certbot certonly --webroot \
                  -w /var/www/certbot \
                  -d "$PRIMARY_DOMAIN" \
                  -d "$SECONDARY_DOMAIN" \
                  --email "$SSL_EMAIL" \
                  --agree-tos \
                  --non-interactive; then
                  echo "Warning: certbot failed, keeping HTTP-only config for this deploy" >&2
                fi
              fi
            else
              echo "Certificate already exists, skipping issuance"
            fi

            # Renovação: o certbot do apt já traz timer/cron próprio, mas sem o
            # deploy-hook o nginx segue servindo o certificado velho em memória
            # até o próximo reload manual — e o site cai por "certificado
            # vencido" com o arquivo novo já em disco.
            mkdir -p /etc/letsencrypt/renewal-hooks/deploy
            printf '%s\n' '#!/bin/sh' 'systemctl reload nginx' \
              > /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
            chmod +x /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh

            # Garante que a renovação automática está de fato armada
            if systemctl list-unit-files | grep -q '^certbot.timer'; then
              systemctl enable --now certbot.timer
              echo "certbot.timer ativo."
            elif [ -f /etc/cron.d/certbot ]; then
              echo "Renovação via /etc/cron.d/certbot."
            else
              # Nem timer nem cron: cria o nosso, senão o certificado vence
              printf '%s\n' \
                '0 3 * * * root certbot renew --quiet --webroot -w /var/www/certbot' \
                > /etc/cron.d/certbot-dramarcela
              echo "Cron de renovação criado em /etc/cron.d/certbot-dramarcela."
            fi

            # ─────────────────────────────────────────────────────────────────
            # Conferência do acme-challenge — sem `certbot renew --dry-run`
            #
            # O dry-run sem `--cert-name` revalidava os ~24 domínios da VPS a
            # cada deploy: demorava minutos e bastava um dos outros sites estar
            # com DNS errado para o comando sair com 1. Pior: quando um dos
            # timers do certbot rodava junto, ele abortava com "Another instance
            # of Certbot is already running" — e, sendo o último comando do
            # step, esse exit 1 matava o job ANTES do "Configure Nginx (HTTPS)",
            # deixando o site preso na configuração HTTP-only.
            #
            # O que interessa aqui é só uma coisa: o webroot do desafio está
            # sendo servido? Isso se verifica com um GET, sem tocar na Let's
            # Encrypt nem competir por lock.
            # ─────────────────────────────────────────────────────────────────
            CHALLENGE_DIR=/var/www/certbot/.well-known/acme-challenge
            mkdir -p "$CHALLENGE_DIR"
            TOKEN="deploy-check-$(date +%s)"
            printf '%s' "$TOKEN" > "$CHALLENGE_DIR/$TOKEN"

            CHALLENGE_OK=0
            for domain in "$PRIMARY_DOMAIN" "$SECONDARY_DOMAIN"; do
              if [ "$(curl -fsS --max-time 15 "http://${domain}/.well-known/acme-challenge/${TOKEN}" 2>/dev/null)" = "$TOKEN" ]; then
                echo "acme-challenge acessível em ${domain}."
                CHALLENGE_OK=1
              else
                echo "Aviso: acme-challenge NÃO responde em ${domain}; a renovação pode falhar." >&2
              fi
            done
            rm -f "$CHALLENGE_DIR/$TOKEN"

            if [ "$CHALLENGE_OK" -ne 1 ]; then
              echo "Aviso: nenhum domínio serviu o desafio. Confira o bloco /.well-known no nginx." >&2
            fi

            # Este step nunca deve derrubar o deploy: a aplicação já está no ar e
            # o certificado atual continua válido. `exit 0` explícito para que
            # nenhum aviso acima vire falha de job.
            exit 0
          ENDSSH

      - name: Configure Nginx (HTTPS)
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "DEPLOY_PORT='${{ env.DEPLOY_PORT }}' PRIMARY_DOMAIN='${{ env.PRIMARY_DOMAIN }}' SECONDARY_DOMAIN='${{ env.SECONDARY_DOMAIN }}' CANONICAL_URL='${{ env.CANONICAL_URL }}' SITE_NAME='${{ env.SITE_NAME }}' bash -s" <<'ENDSSH'
            set -euo pipefail

            if [ ! -f "/etc/letsencrypt/live/${PRIMARY_DOMAIN}/fullchain.pem" ]; then
              echo "SSL cert not found, keeping HTTP-only config"
              exit 0
            fi

            # Cópia da config que está no ar, para restaurar se o nginx -t reprovar
            BACKUP_CONF=""
            if [ -f "/etc/nginx/sites-available/${SITE_NAME}" ]; then
              BACKUP_CONF="/tmp/${SITE_NAME}.nginx.bak"
              cp "/etc/nginx/sites-available/${SITE_NAME}" "$BACKUP_CONF"
            fi

            # HTTP/2 mudou de sintaxe no nginx 1.25.1: antes era um parâmetro do
            # `listen`, depois virou a diretiva `http2`. Emitir a forma errada
            # aborta o `nginx -t` — a antiga só gera aviso nas versões novas,
            # mas a nova é "unknown directive" nas antigas.
            NGINX_VERSION="$(nginx -v 2>&1 | sed -n 's#.*nginx/\([0-9.]*\).*#\1#p')"
            if [ -n "$NGINX_VERSION" ] && \
               [ "$(printf '%s\n1.25.1\n' "$NGINX_VERSION" | sort -V | head -n1)" = "1.25.1" ]; then
              HTTP2_LISTEN='    listen 443 ssl;'
              HTTP2_DIRECTIVE='    http2 on;'
            else
              HTTP2_LISTEN='    listen 443 ssl http2;'
              HTTP2_DIRECTIVE=''
            fi
            echo "nginx ${NGINX_VERSION:-desconhecido}: usando '${HTTP2_DIRECTIVE:-listen ... http2}'"

            {
              printf '%s\n' 'server {'
              printf '%s\n' '    listen 80;'
              printf '%s\n' "    server_name ${PRIMARY_DOMAIN} ${SECONDARY_DOMAIN};"
              printf '%s\n' ''
              printf '%s\n' '    # Precede o redirecionamento: um "return 301" solto responde 301'
              printf '%s\n' '    # também ao desafio do Let'"'"'s Encrypt e a renovação falha, derrubando'
              printf '%s\n' '    # o site por certificado vencido.'
              printf '%s\n' '    location /.well-known/acme-challenge/ {'
              printf '%s\n' '        root /var/www/certbot;'
              printf '%s\n' '    }'
              printf '%s\n' ''
              printf '%s\n' '    location / {'
              printf '%s\n' "        return 301 ${CANONICAL_URL}\$request_uri;"
              printf '%s\n' '    }'
              printf '%s\n' '}'
              printf '%s\n' ''
              printf '%s\n' 'server {'
              printf '%s\n' "$HTTP2_LISTEN"
              # `[ … ] && printf` devolveria 1 aqui e o `set -e` mataria o deploy
              if [ -n "$HTTP2_DIRECTIVE" ]; then printf '%s\n' "$HTTP2_DIRECTIVE"; fi
              printf '%s\n' "    server_name ${PRIMARY_DOMAIN} ${SECONDARY_DOMAIN};"
              printf '%s\n' ''
              printf '%s\n' "    ssl_certificate /etc/letsencrypt/live/${PRIMARY_DOMAIN}/fullchain.pem;"
              printf '%s\n' "    ssl_certificate_key /etc/letsencrypt/live/${PRIMARY_DOMAIN}/privkey.pem;"
              printf '%s\n' '    ssl_protocols TLSv1.2 TLSv1.3;'
              printf '%s\n' '    ssl_ciphers HIGH:!aNULL:!MD5;'
              printf '%s\n' ''
              printf '%s\n' '    # Upload de exame e foto vai direto ao MinIO por URL assinada, mas'
              printf '%s\n' '    # o proxy precisa deixar passar o mesmo teto aceito pela API (50MB).'
              printf '%s\n' '    client_max_body_size 50m;'
              printf '%s\n' ''
              printf '%s\n' '    # O certbot segue o redirecionamento do :80 até aqui na renovação'
              printf '%s\n' '    location /.well-known/acme-challenge/ {'
              printf '%s\n' '        root /var/www/certbot;'
              printf '%s\n' '    }'
              printf '%s\n' ''
              printf '%s\n' '    location / {'
              printf '%s\n' "        proxy_pass http://127.0.0.1:${DEPLOY_PORT};"
              printf '%s\n' '        proxy_http_version 1.1;'
              printf '%s\n' '        proxy_set_header Upgrade $http_upgrade;'
              printf '%s\n' '        proxy_set_header Connection "upgrade";'
              printf '%s\n' '        proxy_set_header Host $host;'
              printf '%s\n' '        proxy_set_header X-Real-IP $remote_addr;'
              printf '%s\n' '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;'
              printf '%s\n' '        proxy_set_header X-Forwarded-Proto $scheme;'
              printf '%s\n' '        proxy_read_timeout 86400;'
              printf '%s\n' '    }'
              printf '%s\n' '}'
            } > "/etc/nginx/sites-available/${SITE_NAME}"

            ln -sfn "/etc/nginx/sites-available/${SITE_NAME}" "/etc/nginx/sites-enabled/${SITE_NAME}"

            # `nginx -t` valida TODOS os vhosts da VPS. Um erro em site de outro
            # projeto reprovaria o teste e nos deixaria sem reload — por isso, ao
            # falhar, restauramos a nossa config anterior e conferimos se o
            # problema era nosso antes de decidir.
            if ! nginx -t 2>/tmp/nginx-test.log; then
              cat /tmp/nginx-test.log >&2
              if [ -f "$BACKUP_CONF" ]; then
                echo "nginx -t falhou: restaurando a config anterior do ${SITE_NAME}." >&2
                cp "$BACKUP_CONF" "/etc/nginx/sites-available/${SITE_NAME}"
              fi
              exit 1
            fi

            systemctl reload nginx
            echo "HTTPS configurado para ${PRIMARY_DOMAIN} e ${SECONDARY_DOMAIN}."
          ENDSSH

      - name: Post-deploy health check
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' DEPLOY_PORT='${{ env.DEPLOY_PORT }}' RELEASE='${{ env.RELEASE_VERSION }}' bash '${{ env.APP_ROOT }}/releases/${{ env.RELEASE_VERSION }}/.github/scripts/remote-health-check.sh'"

      # ───────────────────────────────────────────────────────────────────────
      # Verificação pelo domínio público
      #
      # O health check acima fala com 127.0.0.1:3095 e por isso enxergava tudo
      # "no ar" mesmo com o site inacessível de fora: a config do nginx do host
      # ficou HTTP-only depois que o step de SSL abortou, e sem nenhum vhost
      # nosso na 443 o domínio caía no certificado de OUTRO projeto da VPS.
      # Este passo roda do runner, atravessando DNS, TLS e nginx de verdade.
      # ───────────────────────────────────────────────────────────────────────
      - name: Verify public HTTPS
        run: |
          set -euo pipefail

          fail=0

          echo "Conferindo o certificado servido em ${{ env.PRIMARY_DOMAIN }} ..."
          cert_subject="$(echo | openssl s_client \
            -connect "${{ env.PRIMARY_DOMAIN }}:443" \
            -servername "${{ env.PRIMARY_DOMAIN }}" 2>/dev/null \
            | openssl x509 -noout -subject 2>/dev/null || true)"
          echo "  $cert_subject"
          if ! printf '%s' "$cert_subject" | grep -q "${{ env.PRIMARY_DOMAIN }}"; then
            echo "::error::A porta 443 está servindo um certificado que não é de ${{ env.PRIMARY_DOMAIN }}. O vhost HTTPS provavelmente não foi aplicado." >&2
            fail=1
          fi

          check_public() {
            local url="$1"
            local label="$2"
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$url" 2>/dev/null || echo 000)"
            if [ "$code" = "200" ]; then
              echo "  ok      $label -> $url"
            else
              echo "::error::$label respondeu HTTP $code em $url" >&2
              fail=1
            fi
          }

          check_public "${{ env.CANONICAL_URL }}/" "site publico"
          check_public "${{ env.CANONICAL_URL }}/admin/" "painel da clinica"
          check_public "${{ env.CANONICAL_URL }}/paciente/" "portal da paciente"
          check_public "${{ env.CANONICAL_URL }}/api/health" "api"

          echo "Conferindo o redirecionamento de HTTP para HTTPS ..."
          redirect_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 \
            "http://${{ env.PRIMARY_DOMAIN }}/" 2>/dev/null || echo 000)"
          if [ "$redirect_code" = "301" ] || [ "$redirect_code" = "308" ]; then
            echo "  ok      HTTP redireciona ($redirect_code)"
          else
            echo "::warning::HTTP respondeu $redirect_code em vez de redirecionar para HTTPS." >&2
          fi

          if [ "$fail" -ne 0 ]; then
            echo "O site não está acessível pelo domínio público." >&2
            exit 1
          fi

          echo "Site acessível por HTTPS com o certificado correto."

      - name: Notify success
        run: |
          echo "Deployment ${{ env.RELEASE_VERSION }} completed successfully"
          echo "URL: ${{ env.CANONICAL_URL }}"
