server {
    listen 80;
    server_name _;

    # Os frontends são recriados nos deploys e recebem IP novo na rede Docker.
    # `upstream server nome:porta` resolve só quando o nginx inicia; se ele não
    # for recriado junto, continua apontando para o IP antigo e pode entregar o
    # HTML de outra aplicação. A resolução dinâmica consulta o DNS interno do
    # Docker a cada troca de endereço.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $web_origin http://web:3000;
    set $api_origin http://api:3001;
    set $admin_origin http://admin:3000;
    set $patient_origin http://patient:3000;
    set $minio_origin http://minio:9000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API proxy
    location /api/ {
        proxy_pass $api_origin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # O SDK da AWS assina a URL incluindo o host e o caminho do bucket, entao o
    # endereco publico precisa responder no mesmo caminho: trocar o host depois
    # de assinar invalidaria a assinatura. Este bloco atende /marcela-files/,
    # que e como a URL assinada chega do navegador.
    location /marcela-files/ {
        proxy_pass $minio_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upload por URL assinada: o corpo vai inteiro para o MinIO.
        client_max_body_size 50m;
        proxy_request_buffering off;
    }

    # Caminho curto das imagens publicas ja gravadas no banco (S3_PUBLIC_BASE_URL).
    location /files/ {
        rewrite ^/files/(.*)$ /marcela-files/$1 break;
        proxy_pass $minio_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        # Com um `proxy_pass` variável, o nginx não remove automaticamente o
        # prefixo da location. A reescrita preserva o contrato anterior: o
        # frontend interno recebe `/assets/...`, nunca `/admin/assets/...`.
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass $admin_origin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /paciente/ {
        rewrite ^/paciente/(.*)$ /$1 break;
        proxy_pass $patient_origin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend proxy
    location / {
        proxy_pass $web_origin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SPA fallback
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    location @fallback {
        proxy_pass $web_origin;
        proxy_set_header Host $host;
    }
}
