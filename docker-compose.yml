# ──────────────────────────────────────────────────────────────────────────────
# Rotacao de log
#
# O driver json-file do Docker NAO rotaciona sozinho: sem isto o arquivo de log
# cresce ate encher o disco — que e compartilhado com os outros projetos desta
# VPS. A ancora abaixo e aplicada a todos os servicos; ao acrescentar um
# servico novo, referencie `*log` nele tambem.
# ──────────────────────────────────────────────────────────────────────────────
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: marcela_postgres
    restart: unless-stopped
    # Teto medido a partir dos vizinhos desta VPS: makucho-postgres usa 47 MiB
    # com limite de 256M. 512M cobre o crescimento do banco com folga.
    mem_limit: 512m
    cpus: 1.0
    logging: *log
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marcela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marcela_secure_pass_2024}
      POSTGRES_DB: ${POSTGRES_DB:-marcela_glow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marcela} -d ${POSTGRES_DB:-marcela_glow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Quay, nao Docker Hub: a MinIO retirou minio/minio e minio/mc de la, e o
    # Hub responde "pull access denied ... may require 'docker login'" tanto
    # para repositorio sem permissao quanto para repositorio inexistente. A
    # mensagem fez parecer falta de login; nenhum login resolveria.
    #
    # Tag de release em vez de :latest — o deploy so falhou quando a imagem
    # sumiu debaixo dele, e com :latest a versao que sobe nao e a que foi
    # testada. Este digest e o mesmo que :latest servia em 22/09/2026.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: marcela_minio
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *log
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minio-secret}
    volumes:
      - minio_data:/data
    networks:
      - internal
    expose:
      - "9000"
      - "9001"
    # Sem isto o minio-init corre contra a formatacao do pool: o container
    # "inicia" em milissegundos, mas o servidor so aceita conexao depois de
    # formatar o volume, e o `mc` recebia connection refused.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    # Mesmo motivo do servico minio acima.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: marcela_minio_init
    # Tarefa de inicializacao: roda o mc uma vez e sai.
    mem_limit: 64m
    cpus: 0.5
    logging: *log
    networks:
      - internal
    depends_on:
      minio:
        # `- minio` apenas esperava o container INICIAR. O servidor so aceita
        # conexao depois de formatar o pool, e o `mc` levava connection
        # refused; o deploy caia em "minio-init didn't complete successfully".
        condition: service_healthy
    # Os comandos eram separados por `;` e terminavam em `exit 0`: cada um
    # rodava mesmo com o anterior falhando, e o servico reportava sucesso de
    # qualquer jeito. Agora `set -e` para no primeiro erro e o codigo de saida
    # e o real — sem bucket nao ha upload de imagem nem de documento, entao
    # isto tem de derrubar o deploy em vez de passar calado.
    #
    # Nada de `#` aqui dentro: em bloco YAML `>` a linha vira comando, nao
    # comentario.
    #
    # Sobre o `mc anonymous set download`: so o prefixo public/ abre sem
    # assinatura, que e onde ficam logo e imagem de site — precisam carregar
    # direto num documento impresso ou na landing. O resto do bucket guarda
    # prontuario e continua exigindo link assinado.
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minio} ${S3_SECRET_ACCESS_KEY:-minio-secret};
      mc mb --ignore-existing local/${S3_BUCKET:-marcela-files};
      mc anonymous set download local/${S3_BUCKET:-marcela-files}/public;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: marcela_api
    restart: unless-stopped
    # O maior teto do conjunto: alem do heap do V8, o RSS inclui o engine do
    # Prisma (binario nativo), buffers e threads. Vizinho comparavel
    # (makucho-api) usa 93 MiB em 192M, mas nao carrega Prisma.
    #
    # NODE_OPTIONS=--max-old-space-size limitaria so o heap do V8, nao o RSS —
    # por isso o teto real do processo e declarado aqui, no container.
    mem_limit: 512m
    cpus: 1.0
    logging: *log
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marcela}:${POSTGRES_PASSWORD:-marcela_secure_pass_2024}@postgres:5432/${POSTGRES_DB:-marcela_glow}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-in-production-32chars}
      NODE_ENV: ${NODE_ENV:-production}
      # Padrao 0: dado ficticio nao entra sozinho. Com `:-1`, cada deploy
      # recriava 16 pacientes e 34 agendamentos de mentira num site publico,
      # bastando a variavel nao estar no .env — e ela nao estava.
      # Para popular uma instalacao nova, ponha SEED_DEMO_DATA=1 no .env.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3095}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1200}
      # nginx do host + nginx deste compose
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-change-this-bootstrap-token}
      PRESCRIPTION_SIGNING_SECRET: ${PRESCRIPTION_SIGNING_SECRET:-change-this-prescription-signing-secret}
      PRESCRIPTION_SIGNING_PRIVATE_KEY: ${PRESCRIPTION_SIGNING_PRIVATE_KEY:-}
      PRESCRIPTION_SIGNING_CERTIFICATE: ${PRESCRIPTION_SIGNING_CERTIFICATE:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3095}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-marcela-files}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minio-secret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:3095/files}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contato@drmarceladuch.com.br}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3095}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3001"
    # A API só fica pronta depois de aplicar as migrations no entrypoint; o
    # start_period cobre esse tempo sem contar como falha.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: marcela_web
    restart: unless-stopped
    # Os tres fronts sao nginx servindo arquivo estatico: os vizinhos
    # equivalentes desta VPS ficam em ~5 MiB.
    mem_limit: 64m
    cpus: 0.5
    logging: *log
    networks:
      - internal
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_TENANT_SLUG: ${VITE_TENANT_SLUG:-marcela-duch}
    container_name: marcela_admin
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    logging: *log
    networks:
      - internal
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  patient:
    build:
      context: .
      dockerfile: apps/patient/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_TENANT_SLUG: ${VITE_TENANT_SLUG:-marcela-duch}
    container_name: marcela_patient
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    logging: *log
    networks:
      - internal
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: marcela_nginx
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    logging: *log
    ports:
      - "${EXTERNAL_PORT:-3095}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - internal
    depends_on:
      web:
        condition: service_started
      admin:
        condition: service_started
      patient:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: marcela_postgres_data
  minio_data:
    name: marcela_minio_data

networks:
  internal:
    name: marcela_internal
    driver: bridge
