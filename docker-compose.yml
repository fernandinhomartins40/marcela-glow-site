version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: marcela_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marcela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marcela_secure_pass_2024}
      POSTGRES_DB: ${POSTGRES_DB:-marcela_glow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marcela} -d ${POSTGRES_DB:-marcela_glow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: marcela_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minio-secret}
    volumes:
      - minio_data:/data
    networks:
      - internal
    expose:
      - "9000"
      - "9001"

  minio-init:
    image: minio/mc:latest
    container_name: marcela_minio_init
    networks:
      - internal
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minio} ${S3_SECRET_ACCESS_KEY:-minio-secret};
      mc mb --ignore-existing local/${S3_BUCKET:-marcela-files};
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: marcela_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marcela}:${POSTGRES_PASSWORD:-marcela_secure_pass_2024}@postgres:5432/${POSTGRES_DB:-marcela_glow}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-in-production-32chars}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3095}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-change-this-bootstrap-token}
      PRESCRIPTION_SIGNING_SECRET: ${PRESCRIPTION_SIGNING_SECRET:-change-this-prescription-signing-secret}
      PRESCRIPTION_SIGNING_PRIVATE_KEY: ${PRESCRIPTION_SIGNING_PRIVATE_KEY:-}
      PRESCRIPTION_SIGNING_CERTIFICATE: ${PRESCRIPTION_SIGNING_CERTIFICATE:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3095}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-marcela-files}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minio-secret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:3095/files}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contato@drmarceladuch.com.br}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: marcela_web
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "3000"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_TENANT_SLUG: ${VITE_TENANT_SLUG:-marcela-duch}
    container_name: marcela_admin
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "3000"
    depends_on:
      - api

  patient:
    build:
      context: .
      dockerfile: apps/patient/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_TENANT_SLUG: ${VITE_TENANT_SLUG:-marcela-duch}
    container_name: marcela_patient
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "3000"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: marcela_nginx
    restart: unless-stopped
    ports:
      - "${EXTERNAL_PORT:-3095}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - internal
    depends_on:
      - web
      - admin
      - patient
      - api

volumes:
  postgres_data:
    name: marcela_postgres_data
  minio_data:
    name: marcela_minio_data

networks:
  internal:
    name: marcela_internal
    driver: bridge
