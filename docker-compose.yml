version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: marcela_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marcela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marcela_secure_pass_2024}
      POSTGRES_DB: ${POSTGRES_DB:-marcela_glow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marcela} -d ${POSTGRES_DB:-marcela_glow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: marcela_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marcela}:${POSTGRES_PASSWORD:-marcela_secure_pass_2024}@postgres:5432/${POSTGRES_DB:-marcela_glow}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-in-production-32chars}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:7002}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: marcela_web
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "3000"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: marcela_nginx
    restart: unless-stopped
    ports:
      - "${EXTERNAL_PORT:-7002}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - internal
    depends_on:
      - web
      - api

volumes:
  postgres_data:
    name: marcela_postgres_data

networks:
  internal:
    name: marcela_internal
    driver: bridge
